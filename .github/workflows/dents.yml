name: dents

on:
  schedule:
    # 00/06/12/18 UTC = 01/07/13/19 Zurich in winter, 02/08/14/20 in summer:
    # night, dawn, day, dusk either way.
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dents
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses this repo's own action.yml, the same one published on the Marketplace.
      - name: Render SVGs
        uses: ./
        with:
          # The default token sees public contributions. For private ones,
          # add a PAT (read:user) as the DENTS_TOKEN secret.
          token: ${{ secrets.DENTS_TOKEN || github.token }}
          github_user_name: ${{ vars.DENTS_USER || github.repository_owner }}
          outputs_dir: dist

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/dents-light.svg dist/dents-dark.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "dents: refresh mountains"
          git push
